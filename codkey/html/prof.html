<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademiaFit - Professores</title>
    <!-- Vinculando o mesmo arquivo CSS centralizado -->
    <link rel="stylesheet" href="../css/prof.css">
</head>
<body>

    <!-- BARRA DE NAVEGAÇÃO -->
    <nav class="navbar">
        <div class="logo-container">
            <span class="logo-icon">🏋️</span>
            <span class="brand-name">AcademiaFit</span>
        </div>
        <ul class="nav-links">
            <li><a href="paginainicial.html">Dashboard</a></li>
            <li><a href="aluno.html">Alunos</a></li>
            <li><a href="prof.html" class="active">Professores</a></li>
            <li><a href="planos.html">Planos</a></li>
            <li><a href="pagamentos.html">Pagamentos</a></li>
            <li><a href="treino.html">Treinos</a></li>
            <li><a href="login.html" data-sair>Sair</a></li>
        </ul>
    </nav>

    <!-- CONTEÚDO DA PÁGINA -->
    <main class="main-container">
        
        <!-- Bloco do Formulário de Cadastro -->
        <section class="form-container">
            <h2 class="form-title">Cadastrar Professor</h2>
            <form id="form-professor">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" required>
                </div>
                
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="senha">Senha inicial (mínimo 6 caracteres)</label>
                    <input type="password" id="senha" minlength="6" required>
                </div>
                
                <div class="form-group">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" required>
                </div>
                
                <div class="form-group">
                    <label for="especialidade">Especialidade</label>
                    <input type="text" id="especialidade" placeholder="Ex: Musculação" required>
                </div>
                
                <button type="submit" class="btn-submit">Cadastrar</button>
            </form>
        </section>

        <!-- Bloco de Professores Cadastrados -->
        <h2 class="section-title">Professores cadastrados</h2>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Especialidade</th>
                    </tr>
                </thead>
                <tbody id="tabela-professores">
                    <!-- Linha de exemplo inicial baseada no padrão visual da tabela vazia -->
                    <tr class="sem-dados">
                        <td colspan="4" class="empty-message">Nenhum professor cadastrado ainda.</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </main>

    <script>
const profTabela=document.querySelector('#tabela-professores');
async function carregarProfessores(){const r=await fetch('/api/professores');const dados=await r.json();profTabela.innerHTML=dados.length?'':'<tr><td colspan="4" class="empty-message">Nenhum professor cadastrado ainda.</td></tr>';dados.forEach(p=>profTabela.insertAdjacentHTML('beforeend',`<tr><td>${p.nome}</td><td>${p.email||'-'}</td><td>${p.telefone||'-'}</td><td>${p.especialidade||'-'}</td></tr>`));}
document.querySelector('#form-professor').addEventListener('submit',async e=>{e.preventDefault();const body={nome:document.querySelector('#nome').value.trim(),email:document.querySelector('#email').value.trim(),senha:document.querySelector('#senha').value,telefone:document.querySelector('#telefone').value.trim(),especialidade:document.querySelector('#especialidade').value.trim()};const r=await fetch('/api/professores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(r.ok){e.target.reset();carregarProfessores()}else alert(d.erro||'Não foi possível cadastrar.')});carregarProfessores();
</script>
<script src="acesso.js"></script>
</body>
</html>
