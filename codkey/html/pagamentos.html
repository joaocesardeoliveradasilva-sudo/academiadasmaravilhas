<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AcademiaFit - Pagamentos</title>
    <!-- Vinculando o mesmo arquivo CSS centralizado -->
    <link rel="stylesheet" href="../css/prof.css">
</head>
<body>

    <!-- BARRA DE NAVEGAÇÃO -->
    <nav class="navbar">
        <div class="logo-container">
            <span class="logo-icon">🏋️</span>
            <span class="brand-name">AcademiaFit</span>
        </div>
        <ul class="nav-links">
            <li><a href="paginainicial.html">Dashboard</a></li>
            <li><a href="aluno.html">Alunos</a></li>
            <li><a href="prof.html">Professores</a></li>
            <li><a href="planos.html">Planos</a></li>
            <li><a href="pagamentos.html" class="active">Pagamentos</a></li>
            <li><a href="treino.html">Treinos</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
            <li><a href="login.html" data-sair>Sair</a></li>
        </ul>
    </nav>

    <!-- CONTEÚDO DA PÁGINA -->
    <main class="main-container">
        
        <!-- Bloco do Formulário de Registro de Pagamento -->
        <section class="form-container">
            <h2 class="form-title">Registrar Pagamento</h2>
            <form>
                <div class="form-group">
                    <label for="aluno">Aluno</label>
                    <select id="aluno" required>
                        <option value="">Selecione um aluno</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="valor-pago">Valor Pago (R$)</label>
                    <input type="text" id="valor-pago" placeholder="Ex: 89,90">
                </div>
                
                <div class="form-group">
                    <label for="data-pagamento">Data de Pagamento</label>
                    <input type="date" id="data-pagamento">
                </div>
                
                <div class="form-group">
                    <label for="forma-pagamento">Forma de Pagamento</label>
                    <input type="text" id="forma-pagamento" placeholder="Ex: Cartão, Pix, Dinheiro">
                </div>
                
                <button type="submit" class="btn-submit">Registrar</button>
            </form>
        </section>

        <!-- Bloco de Histórico de Pagamentos -->
        <h2 class="section-title">Histórico de pagamentos</h2>
        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>Valor</th>
                        <th>Data</th>
                        <th>Forma de Pagamento</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- As linhas com o histórico de pagamentos entrarão aqui -->
                </tbody>
            </table>
        </div>

    </main>

    <script>
const alunoPagamento=document.querySelector('#aluno');const pagamentoTabela=document.querySelector('.data-table tbody');
async function carregarAlunosPagamento(){const r=await fetch('/api/alunos');const dados=await r.json();dados.forEach(a=>alunoPagamento.insertAdjacentHTML('beforeend',`<option value="${a.id}">${a.nome}</option>`));}
async function carregarPagamentos(){const r=await fetch('/api/pagamentos');const dados=await r.json();pagamentoTabela.innerHTML=dados.length?'':'<tr><td colspan="4" class="empty-message">Nenhum pagamento registrado.</td></tr>';dados.forEach(p=>pagamentoTabela.insertAdjacentHTML('beforeend',`<tr><td>${p.aluno}</td><td>R$ ${Number(p.valor).toLocaleString('pt-BR',{minimumFractionDigits:2})}</td><td>${new Date(p.data+'T00:00:00').toLocaleDateString('pt-BR')}</td><td>${p.forma||'-'}${p.plano?' · '+p.plano:''} · ${p.status}</td></tr>`));}
document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const body={aluno_id:alunoPagamento.value,valor:document.querySelector('#valor-pago').value,data:document.querySelector('#data-pagamento').value,forma:document.querySelector('#forma-pagamento').value};const r=await fetch('/api/pagamentos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(r.ok){e.target.reset();carregarPagamentos()}else alert(d.erro||'Não foi possível registrar.')});carregarAlunosPagamento();carregarPagamentos();
</script>
<script src="acesso.js"></script>
</body>
</html>
